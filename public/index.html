<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Casa">
<link rel="manifest" href="manifest.json">
<title>Casa</title>
<style>
:root{--bg:#0f1216;--panel:#181d24;--panel2:#202731;--line:#2a323d;--text:#eef2f6;--mut:#8a97a8;--acc:#ffb547;--cool:#4cc3ff;--hot:#ff7a59;--ok:#4ade80;--bad:#f87171;--r:20px}
@media(prefers-color-scheme:light){:root{--bg:#f2f4f7;--panel:#fff;--panel2:#eef1f5;--line:#dfe4ea;--text:#141a22;--mut:#667385}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:17px/1.35 -apple-system,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:16px;padding:18px 0 10px}
h1{font-size:28px;margin:0;flex:1;font-weight:700}
#clock{color:var(--mut);font-variant-numeric:tabular-nums}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 18px;border-radius:99px;font-size:16px;min-height:44px}
.chip.on{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:600}
nav{display:flex;gap:10px;overflow-x:auto;padding:6px 0 14px;scrollbar-width:none}
.scenes{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.scene{flex:0 0 auto;min-width:150px;min-height:76px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:18px;display:flex;align-items:center;gap:10px;padding:0 20px}
.scene span{font-size:28px}.scene:active,.card button:active,.chip:active{transform:scale(.97)}
main{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:6px 0 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.card h3{margin:0;font-size:18px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card small{color:var(--mut);font-weight:400}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}.dot.off{background:var(--bad)}
.row{display:flex;gap:10px}
.card button{flex:1;min-height:64px;border-radius:16px;border:0;background:var(--panel2);color:var(--text);font-size:22px}
.card button.big{font-size:18px}
.card button.act{background:var(--acc);color:#1a1200;font-weight:700}
.card button.cool.act{background:var(--cool)}.card button.heat.act{background:var(--hot)}
.temp{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.temp b{font-size:46px;font-weight:300;font-variant-numeric:tabular-nums}
.temp .set{display:flex;align-items:center;gap:12px}.temp .set button{flex:none;width:56px;min-height:56px}
.mut{color:var(--mut);font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,80px);background:var(--panel2);border:1px solid var(--line);padding:14px 22px;border-radius:99px;transition:.25s;opacity:0}
#toast.show{transform:translate(-50%,0);opacity:1}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:var(--r);padding:22px;width:min(560px,92vw)}
dialog::backdrop{background:#0008}
dialog h2{margin:0 0 14px}dialog input,dialog select{font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);width:100%;margin-bottom:12px}
.sch{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.days{display:flex;gap:6px;margin-bottom:12px}.days .chip{padding:8px 0;flex:1;min-height:40px}
</style>
</head>
<body>
<header><h1 id="title">Casa</h1><span id="clock"></span><button class="chip" id="schBtn">⏰ Orari</button></header>
<div class="scenes" id="scenes"></div>
<nav id="rooms"></nav>
<main id="grid"></main>
<div id="toast"></div>

<dialog id="schDlg"><h2>Orari automatici</h2><div id="schList"></div>
  <h3>Nuovo orario</h3>
  <select id="schScene"></select>
  <input id="schTime" type="time" value="07:30">
  <div class="days" id="schDays"></div>
  <div class="row" style="gap:10px"><button class="chip on" id="schAdd">Aggiungi</button><button class="chip" id="schClose">Chiudi</button></div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const qs = new URLSearchParams(location.search);
let DEMO = qs.has('demo'), cfg, st = {}, room = 'Tutte', schedules = [];

// ---------- API (con modalità demo locale) ----------
const demo = {
  cfg: { devices: [
    {id:'s1',name:'Tapparella',room:'Soggiorno',type:'shutter'},{id:'l1',name:'Luce',room:'Soggiorno',type:'light'},
    {id:'t1',name:'Termovalvola',room:'Soggiorno',type:'thermostat'},{id:'a1',name:'Climatizzatore',room:'Soggiorno',type:'ac'},
    {id:'s2',name:'Tapparella',room:'Camera',type:'shutter'},{id:'l2',name:'Luce',room:'Camera',type:'light'},
    {id:'t2',name:'Termovalvola',room:'Camera',type:'thermostat'},{id:'a2',name:'Climatizzatore',room:'Camera',type:'ac'},
    {id:'p1',name:'Portone',room:'Ingresso',type:'door'},{id:'l3',name:'Luce',room:'Cucina',type:'light'},{id:'s3',name:'Tapparella',room:'Cucina',type:'shutter'}],
    scenes: [{id:'buongiorno',name:'Buongiorno',icon:'☀️'},{id:'buonanotte',name:'Buonanotte',icon:'🌙'},{id:'esco',name:'Esco di casa',icon:'🚪'}] },
  st: { t1:{current:20.4,target:21,on:true,online:true}, t2:{current:19.1,target:19,on:true,online:true}, a1:{on:false,target:24,mode:'cool',online:true}, a2:{on:false,target:24,mode:'cool',online:true}, l1:{on:true,online:true} },
};
async function api(path, opts = {}) {
  if (DEMO) return demoApi(path, opts);
  const pin = localStorage.getItem('pin') || '';
  const r = await fetch('/api/' + path, { ...opts, headers: { 'content-type': 'application/json', 'x-pin': pin } });
  if (r.status === 401) { const p = prompt('PIN'); if (p) { localStorage.setItem('pin', p); return api(path, opts); } }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.json();
}
function demoApi(path, opts) {
  const body = opts.body ? JSON.parse(opts.body) : {};
  if (path === 'config') return demo.cfg;
  if (path === 'state') return demo.st;
  if (path === 'command') { demo.st[body.device] = { ...demo.st[body.device], ...body.command, online: true }; return { ok: true }; }
  if (path === 'scene') { const off = body.scene !== 'buongiorno'; demo.cfg.devices.forEach((d) => { if (d.type === 'light') demo.st[d.id] = { on: !off }; if (d.type === 'shutter') demo.st[d.id] = { action: off ? 'down' : 'up' }; }); return []; }
  if (path === 'schedules') { if (opts.method === 'PUT') demo.sch = body.schedules; return demo.sch || []; }
}

// ---------- UI ----------
const ICON = { door: '🚪', shutter: '🪟', light: '💡', thermostat: '🌡️', ac: '❄️' };
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); };
const h = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function send(device, command) {
  st[device] = { ...st[device], ...command }; render();
  try { await api('command', { method: 'POST', body: JSON.stringify({ device, command }) }); }
  catch (e) { toast('Errore: ' + e.message); refresh(); }
}
async function scene(id, name) {
  toast(`${name}…`);
  try {
    const r = await api('scene', { method: 'POST', body: JSON.stringify({ scene: id }) });
    const bad = (r || []).filter((x) => !x.ok).length;
    toast(bad ? `${name}: ${bad} azioni fallite` : `${name} ✓`); refresh();
  } catch (e) { toast('Errore: ' + e.message); }
}

function card(d) {
  const s = st[d.id] || {}, a = (c) => `data-id="${d.id}" data-cmd='${JSON.stringify(c)}'`;
  const dot = s.online === false ? '<i class="dot off" title="offline"></i>' : '';
  const head = `<h3><span>${ICON[d.type]} ${h(d.name)} <small>${room === 'Tutte' ? h(d.room) : ''}</small></span>${dot}</h3>`;
  if (d.type === 'light') return `<div class="card">${head}<div class="row"><button class="big ${s.on ? 'act' : ''}" ${a({ on: !s.on })}>${s.on ? 'Accesa' : 'Spenta'}</button></div></div>`;
  if (d.type === 'door') return `<div class="card">${head}<button class="big hold" data-door="${d.id}">Tieni premuto per aprire</button></div>`;
  if (d.type === 'shutter') return `<div class="card">${head}<div class="row">
    <button class="${s.action === 'up' ? 'act' : ''}" ${a({ action: 'up' })}>▲</button>
    <button class="big" ${a({ action: 'stop' })}>■ Stop</button>
    <button class="${s.action === 'down' ? 'act' : ''}" ${a({ action: 'down' })}>▼</button></div></div>`;
  if (d.type === 'thermostat') return `<div class="card">${head}<div class="temp"><div><b>${s.current ?? '--'}°</b><div class="mut">attuale</div></div>
    <div class="set"><button ${a({ target: (s.target ?? 20) - 0.5 })}>−</button><div style="text-align:center"><b style="font-size:34px">${s.target ?? '--'}°</b><div class="mut">impostata</div></div><button ${a({ target: (s.target ?? 20) + 0.5 })}>+</button></div></div>
    <div class="row"><button class="big heat ${s.on ? 'act' : ''}" ${a({ on: !s.on })}>${s.on ? 'Attiva' : 'Spenta'}</button></div></div>`;
  if (d.type === 'ac') return `<div class="card">${head}<div class="temp"><div class="mut">${s.current != null ? s.current + '° attuale' : ''}</div>
    <div class="set"><button ${a({ target: (s.target ?? 24) - 1 })}>−</button><b style="font-size:42px">${s.target ?? '--'}°</b><button ${a({ target: (s.target ?? 24) + 1 })}>+</button></div></div>
    <div class="row"><button class="big ${s.on ? 'act' : ''}" ${a({ on: !s.on })}>${s.on ? 'Acceso' : 'Spento'}</button>
    <button class="big cool ${s.mode === 'cool' ? 'act' : ''}" ${a({ mode: 'cool' })}>❄ Freddo</button>
    <button class="big heat ${s.mode === 'heat' ? 'act' : ''}" ${a({ mode: 'heat' })}>☀ Caldo</button></div></div>`;
  return '';
}

function render() {
  if (!cfg) return;
  const rooms = ['Tutte', ...new Set(cfg.devices.map((d) => d.room))];
  $('#rooms').innerHTML = rooms.map((r) => `<button class="chip ${r === room ? 'on' : ''}" data-room="${h(r)}">${h(r)}</button>`).join('');
  $('#scenes').innerHTML = cfg.scenes.map((s) => `<button class="scene" data-scene="${s.id}" data-name="${h(s.name)}"><span>${s.icon}</span>${h(s.name)}</button>`).join('');
  $('#grid').innerHTML = cfg.devices.filter((d) => room === 'Tutte' || d.room === room).map(card).join('');
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.room) { room = b.dataset.room; render(); }
  else if (b.dataset.scene) scene(b.dataset.scene, b.dataset.name);
  else if (b.dataset.id) send(b.dataset.id, JSON.parse(b.dataset.cmd));
});

// Portone: serve tenere premuto 1,2 s (evita aperture accidentali).
let holdT;
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('[data-door]'); if (!b) return;
  b.style.background = 'var(--hot)';
  holdT = setTimeout(async () => { try { await api('command', { method: 'POST', body: JSON.stringify({ device: b.dataset.door, command: { open: true } }) }); toast('Portone aperto 🚪'); navigator.vibrate?.(80); } catch (err) { toast('Errore: ' + err.message); } }, 1200);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => document.addEventListener(t, () => { clearTimeout(holdT); document.querySelectorAll('[data-door]').forEach((b) => (b.style.background = '')); }, true));

async function refresh() { try { st = await api('state'); } catch (e) { toast('Offline: ' + e.message); } render(); }
async function init() {
  try { cfg = await api('config'); }
  catch (e) { if (!DEMO && location.hostname !== 'localhost') { DEMO = true; toast('Backend non raggiungibile: modalità demo'); cfg = demo.cfg; } else { DEMO = true; cfg = demo.cfg; } }
  if (DEMO) $('#title').textContent = 'Casa · demo';
  await refresh(); setInterval(refresh, 20000);
}
setInterval(() => { $('#clock').textContent = new Date().toLocaleString('it-IT', { weekday: 'long', hour: '2-digit', minute: '2-digit' }); }, 1000);

// ---------- Orari ----------
const DAYS = ['L', 'M', 'M', 'G', 'V', 'S', 'D'];
$('#schDays').innerHTML = DAYS.map((d, i) => `<button class="chip on" data-d="${i + 1}">${d}</button>`).join('');
$('#schDays').onclick = (e) => e.target.closest('button')?.classList.toggle('on');
async function loadSch() {
  schedules = (await api('schedules')) || [];
  $('#schScene').innerHTML = cfg.scenes.map((s) => `<option value="${s.id}">${s.icon} ${h(s.name)}</option>`).join('');
  $('#schList').innerHTML = schedules.length ? schedules.map((s, i) => {
    const sc = cfg.scenes.find((x) => x.id === s.scene);
    return `<div class="sch"><span><b>${s.time}</b> ${sc ? sc.icon + ' ' + h(sc.name) : '?'} <span class="mut">${s.days.length === 7 ? 'ogni giorno' : s.days.map((d) => DAYS[d - 1]).join(' ')}</span></span><button class="chip" data-del="${i}">Elimina</button></div>`;
  }).join('') : '<p class="mut">Nessun orario impostato.</p>';
}
const saveSch = async () => { await api('schedules', { method: 'PUT', body: JSON.stringify({ schedules }) }); loadSch(); };
$('#schBtn').onclick = async () => { await loadSch(); $('#schDlg').showModal(); };
$('#schClose').onclick = () => $('#schDlg').close();
$('#schList').onclick = (e) => { const i = e.target.dataset.del; if (i != null) { schedules.splice(+i, 1); saveSch(); } };
$('#schAdd').onclick = () => {
  const days = [...document.querySelectorAll('#schDays .on')].map((b) => +b.dataset.d);
  schedules.push({ id: Date.now().toString(36), scene: $('#schScene').value, time: $('#schTime').value, days, enabled: true });
  saveSch();
};
init();
</script>
</body>
</html>
