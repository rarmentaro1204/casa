<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Casa">
<meta name="theme-color" content="#0e1013">
<link rel="manifest" href="manifest.json">
<title>Casa</title>
<style>
:root{
  --bg:#f4f2ef;--surface:#fff;--surface-2:#f1efeb;--surface-3:#e6e3de;--line:#e6e2dc;
  --text:#16171a;--muted:#6c6e74;--faint:#a5a6ab;
  --accent:#e2862c;--accent-ink:#2a1500;--accent-soft:#fbead8;
  --heat:#ec6a2e;--heat-soft:#fde6db;--cool:#2794dc;--cool-soft:#ddeefc;--prog:#7a64df;--prog-soft:#ece8ff;
  --ok:#1d9a52;--ok-soft:#dcf3e5;--bad:#d4433b;--bad-soft:#fbe2e0;--warn:#b7791f;--warn-soft:#fbf0d9;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 6px 20px rgba(20,20,20,.05);
  --r:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1013;--surface:#171a1f;--surface-2:#20242b;--surface-3:#2b3039;--line:#262b33;
  --text:#eef0f3;--muted:#949ba6;--faint:#5d646f;
  --accent:#f2a04c;--accent-ink:#241200;--accent-soft:#3a2716;
  --heat:#ff8b4e;--heat-soft:#3a2218;--cool:#5cb9f6;--cool-soft:#15293a;--prog:#a897ff;--prog-soft:#26203f;
  --ok:#4bd884;--ok-soft:#14301f;--bad:#f77b72;--bad-soft:#3b1b1b;--warn:#e9b14f;--warn-soft:#352915;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0e1013;--surface:#171a1f;--surface-2:#20242b;--surface-3:#2b3039;--line:#262b33;
  --text:#eef0f3;--muted:#949ba6;--faint:#5d646f;
  --accent:#f2a04c;--accent-ink:#241200;--accent-soft:#3a2716;
  --heat:#ff8b4e;--heat-soft:#3a2218;--cool:#5cb9f6;--cool-soft:#15293a;--prog:#a897ff;--prog-soft:#26203f;
  --ok:#4bd884;--ok-soft:#14301f;--bad:#f77b72;--bad-soft:#3b1b1b;--warn:#e9b14f;--warn-soft:#352915;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;text-align:inherit}
button:active{transform:scale(.98)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Struttura */
.app{display:grid;grid-template-columns:96px minmax(0,1fr);min-height:100dvh}
.rail{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:calc(20px + env(safe-area-inset-top)) 10px 20px;background:var(--surface);border-right:1px solid var(--line);z-index:20}
.brand{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);margin-bottom:14px}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;width:74px;padding:10px 0;border-radius:16px;color:var(--muted);font-size:12px;font-weight:600}
.tab.on{background:var(--accent-soft);color:var(--accent)}
.rail .spacer{flex:1}
main{width:100%;max-width:1240px;padding:calc(22px + env(safe-area-inset-top)) clamp(16px,3.2vw,40px) 48px}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;justify-content:space-around;gap:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .brand,.rail .spacer{display:none}
  .tab{flex:1;width:auto;padding:8px 0;font-size:11px}
  main{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
}

/* Intestazione e sezioni */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.head h1{margin:0;font-size:clamp(28px,4vw,38px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.head .sub{color:var(--muted);margin-top:4px;font-size:15px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 12px}
.sec h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.link{color:var(--accent);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:2px}
.link svg.i{width:18px;height:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}

/* Scenari */
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);min-height:72px;box-shadow:var(--shadow)}
.mode .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.mode b{display:block;font-size:16px}
.mode small{display:block;color:var(--muted);font-size:13px;line-height:1.3;margin-top:2px}
.mode.on{border-color:var(--accent);background:var(--accent-soft)}
.mode.on .ic{background:var(--accent);color:var(--accent-ink)}
@media (max-width:600px){.mode{flex-direction:column;align-items:flex-start;gap:8px;padding:12px}.mode small{display:none}.mode b{font-size:14px}}

/* Riepilogo riscaldamento e linea oraria */
.hs{display:flex;gap:14px;align-items:flex-start}
.hs .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--heat-soft);color:var(--heat);flex:none}
.hs .ic.off{background:var(--surface-2);color:var(--muted)}
.hs .ic.prog{background:var(--prog-soft);color:var(--prog)}
.hs b{display:block;font-size:17px}
.hs .muted{font-size:14px;margin-top:2px}
.tl{position:relative;height:30px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:14px}
.tl .slot{position:absolute;top:0;bottom:0;background:var(--heat);opacity:.9;border-radius:6px}
.tl .now{position:absolute;top:0;bottom:0;width:2px;background:var(--text);box-shadow:0 0 0 2px var(--surface)}
.tlx{display:flex;justify-content:space-between;color:var(--faint);font-size:12px;margin-top:6px}

/* Avvisi */
.alerts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.al{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--warn-soft);color:var(--text);width:100%}
.al.bad{background:var(--bad-soft)}
.al svg.i{color:var(--warn)}.al.bad svg.i{color:var(--bad)}
.al b{display:block;font-size:15px}
.al small{display:block;color:var(--muted);font-size:13px;word-break:break-word}
.al .chev{margin-left:auto;color:var(--faint)}

/* Tessere temperatura */
.temps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tt{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-height:122px}
.tt .n{font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt .t{font-size:36px;font-weight:300;letter-spacing:-.03em;line-height:1.05;margin-top:auto}
.tt.heat{background:var(--heat-soft);border-color:color-mix(in srgb,var(--heat) 30%,var(--line))}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint)}
.st.heat{color:var(--heat)}.st.heat::before{background:var(--heat)}
.st.ok{color:var(--ok)}.st.ok::before{background:var(--ok)}
.st.prog{color:var(--prog)}.st.prog::before{background:var(--prog)}
.st.bad{color:var(--bad)}.st.bad::before{background:var(--bad)}

/* Azioni rapide */
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.qa{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-height:64px;font-weight:600;font-size:15px}
.qa .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}

/* Clima: valvole */
.hcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hcard-top h3{margin:0;font-size:19px}
.grp{margin-top:18px}
.grp h4{margin:0 0 2px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.vl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:14px;width:100%;padding:12px 2px;border-bottom:1px solid var(--line)}
.vl:last-child{border-bottom:0}
.vl .nm b{display:block;font-weight:600;font-size:16px}
.vl .nm .err{display:block;color:var(--bad);font-size:13px;margin-top:2px}
.vl .cur{font-size:24px;font-weight:300;letter-spacing:-.02em;text-align:right;min-width:64px}
.vl .tg{font-size:13px;color:var(--muted);text-align:right;min-width:88px}
.vl svg.i{color:var(--faint);width:18px;height:18px}
@media (max-width:520px){.vl{grid-template-columns:minmax(0,1fr) auto}.vl .tg{display:none}}

/* Controlli comuni */
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2);overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;border-radius:11px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button svg.i{width:18px;height:18px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 30%}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper button{width:56px;height:56px;border-radius:18px;background:var(--surface-2);display:grid;place-items:center}
.stepper .v{font-size:52px;font-weight:300;letter-spacing:-.03em;text-align:center;line-height:1}
.stepper .v small{display:block;font-size:13px;letter-spacing:0;color:var(--muted);font-weight:500;margin-top:6px}
.btn{min-height:52px;padding:0 18px;border-radius:16px;background:var(--surface-2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--text);color:var(--bg)}
.btn.on{background:var(--accent);color:var(--accent-ink)}
.btns{display:flex;gap:10px;margin-top:16px}.btns .btn{flex:1}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 8px}
.hint{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:14px;color:var(--muted)}
.hint svg.i{width:18px;height:18px;margin-top:1px}

/* Climatizzatori */
.ac-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ac-top b{font-size:18px;display:block}.ac-top small{color:var(--muted);font-size:14px}
.pwr{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.pwr.on{background:var(--cool);color:#fff}
.ac .stepper{margin:18px 0}
.ac.off .stepper,.ac.off .seg{opacity:.45}
.ac .more{margin-top:12px;width:100%;justify-content:center}

/* Luci e tapparelle */
.room h3{margin:0 0 12px;font-size:18px}
.rows{display:flex;flex-direction:column;gap:8px}
.lt{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:16px;background:var(--surface-2);font-weight:600;min-height:60px}
.lt .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);flex:none}
.lt.on{background:var(--accent-soft)}.lt.on .ic{background:var(--accent);color:var(--accent-ink)}
.lt .r{margin-left:auto;font-size:13px;font-weight:500;color:var(--muted)}
.sh{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surface-2);min-height:60px}
.sh .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);flex:none}
.sh b{font-weight:600}
.sh .ctl{margin-left:auto;display:flex;gap:6px}
.sh .ctl button{width:48px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center}
.sh .ctl button.on{background:var(--accent);color:var(--accent-ink)}
.err-line{color:var(--bad);font-size:13px;margin-top:-2px;padding:0 4px}

/* Ingresso */
.lock{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 20px}
.lock .big{width:96px;height:96px;border-radius:30px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);margin-bottom:8px}
.lock .big.open{background:var(--bad-soft);color:var(--bad)}
.lock .big svg.i{width:44px;height:44px}
.lock h3{margin:0;font-size:24px}
.lock .btns{width:100%}
.hold{position:relative;overflow:hidden}
.hold::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);opacity:.35}
.hold.holding::before{width:100%;transition:width 1.2s linear}
.hold>*{position:relative}

/* Testata viva */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 24px 20px;color:#fff;margin-bottom:14px;background:var(--hero);box-shadow:0 14px 34px -16px rgba(40,20,90,.55)}
.hero.morning{--hero:linear-gradient(135deg,#f3a25a 0%,#e5707d 55%,#7a6fd8 100%)}
.hero.day{--hero:linear-gradient(135deg,#46a2e4 0%,#3a7bd5 55%,#5c5fd6 100%)}
.hero.evening{--hero:linear-gradient(135deg,#ee8a4b 0%,#c1507e 55%,#4b3a93 100%)}
.hero.night{--hero:linear-gradient(135deg,#21305e 0%,#2c2556 60%,#111a37 100%)}
.hero::before{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.38),rgba(255,255,255,0) 68%);pointer-events:none}
.hero.night::before{background:radial-gradient(circle,rgba(200,210,255,.22),rgba(255,255,255,0) 68%)}
.hero>*{position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hello{font-size:clamp(30px,4.6vw,44px);font-weight:700;letter-spacing:-.025em;line-height:1.05}
.hdate{opacity:.85;margin-top:5px;font-size:15px}
.say{font-size:clamp(17px,2.1vw,21px);line-height:1.45;margin:18px 0 16px;max-width:780px;font-weight:500;opacity:.97}
.say b{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip2{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:14px;font-weight:600}
.chip2 svg.i{width:17px;height:17px}
.chip2.alert{background:#fff;color:#c2362e}
.hero .wx{background:rgba(255,255,255,.18);border:0;color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero .wx svg.i{color:#fff}.hero .wx small{color:rgba(255,255,255,.82)}

/* Stanze */
.rooms2{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.rc{position:relative;display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-height:140px;overflow:hidden;transition:transform .15s}
.rc.warm{background:linear-gradient(160deg,var(--heat-soft) 0%,var(--surface) 80%);border-color:color-mix(in srgb,var(--heat) 28%,var(--line))}
.rc.lit::after{content:"";position:absolute;left:-30px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(245,197,66,.35),transparent 70%);pointer-events:none}
.rc .nm{font-weight:650;font-size:15px;padding-right:70px}
.rc .tp{font-size:36px;font-weight:300;letter-spacing:-.035em;margin-top:auto;line-height:1.05}
.rc .sb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .bd{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.bdg{width:26px;height:26px;border-radius:9px;display:grid;place-items:center}
.bdg svg.i{width:15px;height:15px;stroke-width:2}
.bdg.heat{background:var(--heat);color:#fff;animation:pulse 2.4s ease-out infinite}
.bdg.cool{background:var(--cool);color:#fff}.bdg.lit{background:#f5c542;color:#3a2a00}.bdg.bad{background:var(--bad);color:#fff}.bdg.open{background:var(--bad);color:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--heat) 60%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sug.bad .ic{background:var(--bad-soft);color:var(--bad)}.sug.warn .ic{background:var(--warn-soft);color:var(--warn)}
.sug.bad{border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}

/* Termostato a ghiera */
.dial{position:relative;width:min(280px,76vw);aspect-ratio:1;margin:0 auto;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}
.dial svg{width:100%;height:100%;overflow:visible;display:block}
.dial .track{fill:none;stroke:var(--surface-3);stroke-width:18;stroke-linecap:round}
.dial .val{fill:none;stroke:var(--accent);stroke-width:18;stroke-linecap:round;transition:stroke .2s}
.dial.heat .val{stroke:var(--heat)}.dial.cool .val{stroke:var(--cool)}.dial.prog .val{stroke:var(--prog)}.dial.off .val{stroke:var(--faint)}
.dial .knob{fill:#fff;stroke:rgba(0,0,0,.1);stroke-width:1;filter:drop-shadow(0 2px 5px rgba(0,0,0,.3))}
.dial .cur{fill:var(--text);stroke:var(--surface);stroke-width:2}
.dial .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dial .center .v{font-size:62px;font-weight:200;letter-spacing:-.04em;line-height:1}
.dial .center small{color:var(--muted);font-size:14px;margin-top:8px;text-align:center}
.dial .center .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fine{display:flex;align-items:center;justify-content:center;gap:16px;margin:-6px 0 6px}
.fine button{width:48px;height:48px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center}
.fine span{font-size:13px;color:var(--faint)}

/* Stanza (pannello) */
.rsec{margin-top:18px}
.rsec h4{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.vr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surface-2);margin-bottom:8px}
.vr .grow{flex:1;min-width:0;text-align:left}.vr .grow b{display:block;font-weight:600}
.vr .cur{font-size:24px;font-weight:300;letter-spacing:-.02em}
.mini{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:12px;padding:3px}
.mini button{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.mini button svg.i{width:16px;height:16px}
.mini span{min-width:42px;text-align:center;font-weight:600;font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Pannello dal basso */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);max-height:90dvh;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:26px 26px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));z-index:41;transform:translate(-50%,105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:translate(-50%,0)}
.sheet:not(.open){visibility:hidden;transition:transform .28s,opacity .2s,visibility 0s .3s}
@media (min-width:761px){
  .sheet{top:50%;bottom:auto;border-radius:26px;padding-bottom:24px;opacity:0;pointer-events:none;transform:translate(-50%,-46%);transition:opacity .2s,transform .22s}
  .sheet.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
  .grab{display:none}
}
.grab{width:40px;height:5px;border-radius:3px;background:var(--surface-3);margin:4px auto 12px}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 18px}
.sheet-h h3{margin:0;font-size:22px}
.sheet-h .muted{font-size:14px;margin-top:2px}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.x svg.i{width:18px;height:18px}
.bigtemp{text-align:center;margin:4px 0 18px}
.bigtemp .t{font-size:64px;font-weight:200;letter-spacing:-.04em;line-height:1}
.bigtemp small{display:block;color:var(--muted);margin-top:6px}
.list .row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 2px;border-bottom:1px solid var(--line)}
.list .row:last-child{border-bottom:0}
.list .row .grow{flex:1;min-width:0}
.list .row b{display:block;font-weight:600}
.list .row small{display:block;color:var(--muted);font-size:13px;word-break:break-word}
.tag{font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--bad-soft);color:var(--bad)}
.form{display:flex;flex-direction:column;gap:10px}
.form select,.form input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2)}
.days{display:flex;gap:6px}
.days button{flex:1;height:42px;border-radius:12px;background:var(--surface-2);font-weight:600;color:var(--muted)}
.days button.on{background:var(--accent);color:var(--accent-ink)}
h4.sh4{margin:22px 0 8px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* Suggerimenti, meteo, scalda ora */
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.hs{position:relative}.hs .act{margin-left:auto;flex:none}
.tl .boost{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--accent) 0 6px,color-mix(in srgb,var(--accent) 60%,transparent) 6px 12px);border-radius:6px}
.sugs{display:flex;flex-direction:column;gap:8px}
.sug{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.sug .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.sug .grow{flex:1 1 200px;min-width:0}.sug b{display:block;font-size:15px}.sug small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.sug .end{display:flex;gap:6px;align-items:center;margin-left:auto}
.x.sm{width:32px;height:32px}
.wx{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.wx svg.i{width:20px;height:20px;color:var(--accent)}
.wx small{color:var(--muted);font-weight:500}
.urlbox{font-size:12px;color:var(--muted);word-break:break-all;user-select:text;-webkit-user-select:text}
ol.steps{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:14px}ol.steps li{margin:4px 0}ol.steps b{color:var(--text)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,120px);max-width:min(92vw,520px);background:var(--text);color:var(--bg);padding:13px 20px;border-radius:16px;font-weight:600;font-size:15px;transition:transform .25s;z-index:60;text-align:center}
#toast.show{transform:translate(-50%,0)}
#toast:not(.show){visibility:hidden;transition:transform .25s,visibility 0s .3s}
@media (max-width:760px){#toast{bottom:calc(84px + env(safe-area-inset-bottom))}}
.empty{color:var(--muted);padding:12px 0}
</style>

<script>

const I = (n, c = '') => `<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n] || ''}</svg>`;

const MODE_IC = { inverno: 'flame', fuori: 'leave', estate: 'sun' };
const AC_MODE = { cool: ['snow', 'Freddo'], cold: ['snow', 'Freddo'], heat: ['sun', 'Caldo'], hot: ['sun', 'Caldo'], auto: ['auto', 'Auto'], dry: ['drop', 'Deumidifica'], wet: ['drop', 'Deumidifica'], wind: ['wind', 'Ventola'], fan: ['wind', 'Ventola'] };
const FAN = { auto: 'Auto', low: 'Bassa', mid: 'Media', middle: 'Media', high: 'Alta', mute: 'Silenziosa', turbo: 'Turbo', strong: 'Forte' };
const EXTRA = { eco: ['leaf', 'Eco'], sleep: ['moon', 'Notte'], turbo: ['wind', 'Turbo'], health: ['leaf', 'Salute'], light: ['sun', 'Display'], child_lock: ['lock', 'Blocco'] };
const DAYN = ['', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato', 'domenica'];

// ---------------------------------------------------------------- stato
const qs = new URLSearchParams(location.search);
let DEMO = qs.has('demo');
const S = { cfg: null, st: {}, heat: null, weather: null, view: ls.get('view') || 'home', sheet: null };
let holding = false, pinResolve = null;
const theme = ls.get('theme'); if (theme) document.documentElement.dataset.theme = theme;

const devs = (type) => (S.cfg?.devices || []).filter((d) => d.type === type);
const byId = (id) => (S.cfg?.devices || []).find((d) => d.id === id);
const label = (d) => d?.label || d?.name || '';
const heatFor = (id) => (S.heat?.devices || []).find((x) => x.id === id);
const boostOn = () => !!(S.heat?.boost && S.heat.boost.until > Date.now());
const clockOf = (ts) => new Date(ts).toLocaleTimeString('it-IT', { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit' });
const acts = (list) => `data-acts='${JSON.stringify(list)}'`;

// ---------------------------------------------------------------- tempo
function romeNow(d = new Date()) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit', hour12: false, weekday: 'short' }).formatToParts(d).map((x) => [x.type, x.value]));
  return { hhmm: `${p.hour === '24' ? '00' : p.hour}:${p.minute}`, day: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].indexOf(p.weekday) + 1 };
}
const toMin = (s) => +s.slice(0, 2) * 60 + +s.slice(3, 5);
const slotsFor = (day) => { const w = S.cfg?.heating?.winter; return w ? (day <= 5 ? w.weekdays : w.weekend) : []; };
const inSlot = (now = romeNow()) => slotsFor(now.day).some(([a, b]) => now.hhmm >= a && now.hhmm < b);
function whenLabel(next) {
  if (!next) return '';
  const now = romeNow(), left = 1440 - toMin(now.hhmm);
  if (next.inMin < left) return `alle ${next.at}`;
  if (next.inMin < left + 1440) return `domani alle ${next.at}`;
  return `${DAYN[next.day]} alle ${next.at}`;
}

// ---------------------------------------------------------------- API (+ demo)
async function api(path, opts = {}) {
  if (DEMO) return demoApi(path, opts);
  const r = await fetch('/api/' + path, { ...opts, headers: { 'content-type': 'application/json', 'x-pin': ls.get('pin') || '' } });
  if (r.status === 401) {
    const pin = await askPin();
    if (pin) { ls.set('pin', pin); return api(path, opts); }
    throw new Error('PIN richiesto');
  }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Errore ' + r.status);
  return r.json();
}

const demo = (() => {
  const v = (id, label, room) => ({ id, name: 'Termovalvola', room, type: 'thermostat', label });

    k1: { locked: true, battery: 76, online: true },
  };
  return { cfg, st, mode: 'inverno', policy: 'app', boost: null, sch: [{ id: 'x', scene: 'buongiorno', time: '07:00', days: [1, 2, 3, 4, 5], enabled: true }] };

function demoHeat() {
  const H = demo.cfg.heating, now = romeNow(), on = demo.mode === 'inverno' && demo.policy === 'app' && slotsFor(now.day).some(([a, b]) => now.hhmm >= a && now.hhmm < b);
  const want = (id) => (H.always.includes(id) ? 'massimo' : demo.mode === 'estate' ? 'spenta' : demo.policy === 'meross' && demo.mode === 'inverno' ? 'programma Meross' : H.base.includes(id) || demo.mode === 'fuori' ? '15°' : on ? '21°' : 'spenta');
  const ids = [...H.always, ...H.base, ...H.group];
  let next = null;
  if (demo.mode === 'inverno' && demo.policy === 'app') {
    const m = toMin(now.hhmm), cut = slotsFor(now.day).flat().map(toMin).find((x) => x > m);

  }
  const b = demo.boost && demo.boost.until > Date.now() ? demo.boost : null;
  if (b) next = { at: clockOf(b.until), day: now.day, inMin: Math.round((b.until - Date.now()) / 60e3) };

}
async function demoApi(path, opts) {
  await new Promise((r) => setTimeout(r, 120));
  const body = opts.body ? JSON.parse(opts.body) : {};
  if (path === 'config') return demo.cfg;
  if (path === 'state') return JSON.parse(JSON.stringify(demo.st));
  if (path === 'heating') return demoHeat();
  if (path === 'mode') { if (opts.method === 'POST') { demo.mode = body.mode; return []; } return { mode: demo.mode }; }

  for (const [err, names] of Object.entries(groups)) out.push({ k: 'warn', icon: 'alert', t: names.length > 2 ? `${names.length} dispositivi non raggiungibili` : `${names.join(' e ')} non raggiungibil${names.length > 1 ? 'i' : 'e'}`, d: err, sheet: 'diag' });

    const s = S.st[d.id] || {};
    if (s.locked === false) out.push({ k: 'bad', icon: 'unlock', t: `${label(d)} aperta`, d: 'Tocca per chiuderla', go: 'ingresso' });
    if (s.battery != null && s.battery < 20) out.push({ k: 'warn', icon: 'alert', t: `Pila ${label(d).toLowerCase()} al ${s.battery}%`, go: 'ingresso' });
  }
  return out;
}

// ---------------------------------------------------------------- pezzi riutilizzabili
const head = (title, sub, right = '') => `<header class="head"><div><h1>${h(title)}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${right}</header>`;
const sec = (title, right = '') => `<div class="sec"><h2>${h(title)}</h2>${right}</div>`;
const go = (view, text) => `<button class="link" data-go="${view}">${h(text)}${I('right')}</button>`;
function greeting() { const hr = +romeNow().hhmm.slice(0, 2); return hr < 5 ? 'Buonanotte' : hr < 13 ? 'Buongiorno' : hr < 18 ? 'Buon pomeriggio' : 'Buonasera'; }
const nowText = () => { const d = new Date(), o = { timeZone: 'Europe/Rome' }; return `${d.toLocaleDateString('it-IT', { ...o, weekday: 'long', day: 'numeric', month: 'long' })} · ${d.toLocaleTimeString('it-IT', { ...o, hour: '2-digit', minute: '2-digit' })}`; };
function dateLine() { return `<span id="clock">${nowText()}</span>`; }

function modesHTML() {
  return `<div class="modes">${(S.cfg.modes || []).map((m) => `<button class="mode ${S.heat?.mode === m.id ? 'on' : ''}" data-mode="${m.id}" data-name="${h(m.name)}"><span class="ic">${I(MODE_IC[m.id] || 'home')}</span><span><b>${h(m.name)}</b><small>${h(m.info || '')}</small></span></button>`).join('')}</div>`;
}
function heatCard(full) {
  const x = heatSummary(), showTl = S.heat?.mode === 'inverno' && S.heat?.policy === 'app';
  const act = x.boost ? `<button class="btn sm act" data-boost-cancel>Annulla</button>`
    : S.heat?.mode && S.heat.mode !== 'estate' && !(showTl && inSlot()) ? `<button class="btn sm act" data-boost="zona">${I('zap')}Scalda 1 ora</button>` : '';
  return `<div class="hs"><span class="ic ${x.ic}">${I(x.icon)}</span><div><b>${h(x.title)}</b><div class="muted">${h(x.sub)}</div></div>${act}</div>${showTl || boostOn() ? timeline() : ''}
`;
}
function valveRow(d) {
  const s = S.st[d.id] || {}, v = vstat(d), x = heatFor(d.id);
  return `<button class="vl" data-sheet="valve" data-id="${h(d.id)}"><span class="nm"><b>${h(label(d))}</b><span class="st ${v.k}">${h(v.t)}</span>${x?.ok === false ? `<span class="err">${h(x.error || '')}</span>` : ''}</span>
    <span class="tg num">${x ? `obiettivo ${h(x.want)}` : s.target != null ? `→ ${fmt(s.target)}°` : ''}</span><span class="cur num">${fmt(s.current)}°</span></button>`;
}

// ---------------------------------------------------------------- viste
const VIEWS = {
  home() {
    const valves = devs('thermostat'), lightsOn = devs('light').filter((d) => S.st[d.id]?.on).length;
    const quick = [
      boostOn() ? `<button class="qa" data-boost-cancel><span class="ic">${I('zap')}</span>Annulla «Scalda ora»</button>`
        : S.heat?.mode && S.heat.mode !== 'estate' ? `<button class="qa" data-boost="zona"><span class="ic">${I('zap')}</span>Scalda 1 ora</button>` : '',
      ...(S.cfg.scenes || []).map((s) => `<button class="qa" data-scene="${s.id}" data-name="${h(s.name)}"><span class="ic">${I(s.id === 'buonanotte' ? 'moon' : 'sun')}</span>${h(s.name)}</button>`),
      devs('light').length ? `<button class="qa" data-bulk="lights-off"><span class="ic">${I('bulb')}</span>Spegni le luci</button>` : '',
      devs('shutter').length ? `<button class="qa" data-bulk="sh-down"><span class="ic">${I('down')}</span>Abbassa tapparelle</button><button class="qa" data-bulk="sh-up"><span class="ic">${I('up')}</span>Alza tapparelle</button>` : '',
    ].join('');
    return heroHTML()
      + modesHTML()
      + `<div class="card" style="margin-top:14px">${heatCard(false)}</div>`
      + suggestionsHTML()
      + sec('Stanze', go('clima', 'Clima'))
      + `<div class="rooms2">${roomsList().map(roomCard).join('')}</div>`
      + sec('Azioni rapide') + `<div class="quick">${quick}</div>`;
  },

  clima() {
    const H = S.cfg.heating || {}, pick = (ids) => (ids || []).map(byId).filter(Boolean);
    const groups = [
      [`Zona giorno · ${H.temp ?? 21}° nelle fasce orarie`, pick(H.group)],
      [`Fisse a ${H.baseTemp ?? 15}°`, pick(H.base)],
      ['Sempre al massimo', pick(H.always)],
    ];
    const known = new Set([...(H.group || []), ...(H.base || []), ...(H.always || [])]);
    const others = devs('thermostat').filter((d) => !known.has(d.id));
    if (others.length) groups.push(['Altre valvole', others]);
    const pol = S.heat?.policy || 'app';
    const heating = `<div class="card">
      <div class="hcard-top"><h3>Riscaldamento</h3>
        <div class="seg" style="max-width:100%"><button class="${pol === 'app' ? 'on' : ''}" data-policy="app">${I('clock')}Orari dell’app</button><button class="${pol === 'meross' ? 'on' : ''}" data-policy="meross">${I('auto')}Programmi Meross</button></div></div>
      <div style="margin-top:16px">${heatCard(true)}</div>
      ${groups.map(([t, list]) => list.length ? `<div class="grp"><h4>${h(t)}</h4>${list.map(valveRow).join('')}</div>` : '').join('')}
    </div>`;
    const acs = devs('ac');
    return head('Clima', h(heatSummary().title)) + modesHTML() + `<div style="margin-top:14px">${heating}</div>`
      + (acs.length ? sec('Climatizzatori') + `<div class="grid2">${acs.map((d) => `<div class="card ac ${S.st[d.id]?.on ? '' : 'off'}">${acControls(d, false)}</div>`).join('')}</div>` : '');
  },

  luci() {
    const items = [...devs('light'), ...devs('shutter')], rooms = [...new Set(items.map((d) => d.room))];
    const on = devs('light').filter((d) => S.st[d.id]?.on).length;
    const bar = `<div class="quick" style="margin-bottom:6px">
      <button class="qa" data-bulk="lights-off"><span class="ic">${I('bulb')}</span>Spegni tutte</button>
      <button class="qa" data-bulk="sh-up"><span class="ic">${I('up')}</span>Alza tutte</button>
      <button class="qa" data-bulk="sh-down"><span class="ic">${I('down')}</span>Abbassa tutte</button></div>`;
    const room = (r) => {
      const list = items.filter((d) => d.room === r);
      return `<div class="card room"><h3>${h(r)}</h3><div class="rows">${list.map((d) => {
        const s = S.st[d.id] || {}, err = s.online === false ? `<div class="err-line">${h(s.error || 'Non raggiungibile')}</div>` : '';
        if (d.type === 'light') return `<button class="lt ${s.on ? 'on' : ''}" ${cmdAttr(d.id, { on: !s.on })}><span class="ic">${I('bulb')}</span>${h(label(d))}<span class="r">${s.on ? 'Accesa' : 'Spenta'}</span></button>${err}`;
        return `<div class="sh"><span class="ic">${I('blinds')}</span><b>${h(label(d))}</b><span class="ctl">
          <button class="${s.action === 'up' ? 'on' : ''}" aria-label="Alza" ${cmdAttr(d.id, { action: 'up' })}>${I('up')}</button>
          <button aria-label="Ferma" ${cmdAttr(d.id, { action: 'stop' })}>${I('stop')}</button>
          <button class="${s.action === 'down' ? 'on' : ''}" aria-label="Abbassa" ${cmdAttr(d.id, { action: 'down' })}>${I('down')}</button></span></div>${err}`;
      }).join('')}</div></div>`;
    };
    return head('Luci e tapparelle', on ? `${on} ${on === 1 ? 'luce accesa' : 'luci accese'}` : 'Tutte le luci spente') + bar
      + (rooms.length ? `<div class="grid2" style="margin-top:14px">${rooms.map(room).join('')}</div>` : '<p class="empty">Nessuna luce o tapparella configurata.</p>');
  },

  ingresso() {
    const locks = devs('lock'), doors = devs('door');
    const lockCard = (d) => {
      const s = S.st[d.id] || {}, open = s.locked === false;
      return `<div class="card lock"><span class="big ${open ? 'open' : ''}">${I(open ? 'unlock' : 'lock')}</span>
        <h3>${h(label(d))}</h3><div class="muted">${s.online === false ? h(s.error || 'Non raggiungibile') : s.locked === undefined ? 'Stato sconosciuto' : open ? 'Aperta' : 'Chiusa'}${s.battery != null ? ` · pila ${s.battery}%` : ''}</div>
        <div class="btns"><button class="btn ${open ? 'primary' : ''}" ${cmdAttr(d.id, { locked: true })}>${I('lock')}<span>Chiudi</span></button>
        <button class="btn hold" data-id="${h(d.id)}" data-hold='{"locked":false}'>${I('unlock')}<span>Apri · tieni premuto</span></button></div></div>`;
    };
    const doorCard = (d) => `<div class="card lock"><span class="big" style="background:var(--surface-2);color:var(--muted)">${I('door')}</span><h3>${h(label(d))}</h3>
        <div class="muted">${S.st[d.id]?.online === false ? h(S.st[d.id].error || 'Non raggiungibile') : 'Apre il portone tramite il citofono'}</div>
        <div class="btns"><button class="btn hold" data-id="${h(d.id)}" data-hold='{"open":true}'>${I('key')}<span>Apri · tieni premuto</span></button></div></div>`;
    return head('Ingresso', 'L’apertura richiede di tenere premuto il pulsante')
      + `<div class="grid2">${locks.map(lockCard).join('')}${doors.map(doorCard).join('')}</div>`
      + `<div class="hint">${I('info')}<span>Porta e portone non si aprono mai da scenari, orari o comandi vocali.</span></div>`;
  },
};

// ---------------------------------------------------------------- climatizzatori
function acControls(d, full, noStepper) {
  const s = S.st[d.id] || {}, c = s.caps || { modes: [], fans: [], swing: false, extras: [], temp: { min: 16, max: 30, step: 1 } };
  const step = c.temp?.step || 1, t = s.target ?? 24, clamp = (x) => Math.min(c.temp?.max ?? 30, Math.max(c.temp?.min ?? 16, x));
  const err = s.online === false ? `<div class="err-line" style="margin-top:10px">${h(s.error || 'Non raggiungibile')}</div>` : '';
  let out = `<div class="ac-top"><div>${noStepper ? `<b>${s.on ? 'Acceso' : 'Spento'}</b><small>Tocca per ${s.on ? 'spegnere' : 'accendere'}</small>` : `<b>${h(d.room)}</b><small>${s.current != null ? `In stanza ${fmt(s.current)}°` : h(label(d))}</small>`}</div>
      <button class="pwr ${s.on ? 'on' : ''}" aria-label="Accendi o spegni" ${cmdAttr(d.id, { on: !s.on })}>${I('power')}</button></div>${err}
    ${noStepper ? '<div style="height:14px"></div>' : `<div class="stepper"><button aria-label="Meno" ${cmdAttr(d.id, { target: clamp(t - step) })}>${I('minus')}</button>
      <div class="v num">${fmt(s.target)}°<small>${s.on ? 'impostata' : 'spento'}</small></div>
      <button aria-label="Più" ${cmdAttr(d.id, { target: clamp(t + step) })}>${I('plus')}</button></div>`}`;
  if (c.modes?.length) out += `<div class="seg wrap">${c.modes.map((m) => { const [ic, n] = AC_MODE[m] || ['auto', m]; return `<button class="${s.mode === m ? 'on' : ''}" ${cmdAttr(d.id, { mode: m })}>${I(ic)}${h(n)}</button>`; }).join('')}</div>`;
  if (!full) {
    if (c.fans?.length || c.swing || c.extras?.length) out += `<button class="btn more" data-sheet="ac" data-id="${h(d.id)}">Ventola e opzioni${I('right')}</button>`;
    return out;
  }
  if (c.fans?.length) out += `<div class="lbl">Ventola</div><div class="seg wrap">${c.fans.map((f) => `<button class="${s.fan === f ? 'on' : ''}" ${cmdAttr(d.id, { fan: f })}>${h(FAN[f] || f)}</button>`).join('')}</div>`;
  if (c.swing || c.extras?.length) {
    out += `<div class="lbl">Opzioni</div><div class="seg wrap">${c.swing ? `<button class="${s.swing ? 'on' : ''}" ${cmdAttr(d.id, { swing: !s.swing })}>${I('swing')}Oscillazione</button>` : ''}`;
    out += (c.extras || []).map((x) => { const on = s.extras?.[x] ?? s[x], [ic, n] = EXTRA[x] || ['info', x]; return `<button class="${on ? 'on' : ''}" ${cmdAttr(d.id, { [x]: !on })}>${I(ic)}${h(n)}</button>`; }).join('') + '</div>';
  }
  return out;
}

// ---------------------------------------------------------------- pannelli dal basso
const sheetHead = (title, sub = '') => `<div class="sheet-h"><div><h3>${h(title)}</h3>${sub ? `<div class="muted">${sub}</div>` : ''}</div><button class="x" data-close aria-label="Chiudi">${I('x')}</button></div>`;
const LIVE = new Set(['valve', 'ac', 'settings', 'room']);
const SHEETS = {
  valve(id) {
    const d = byId(id); if (!d) return sheetHead('Valvola');
    const s = S.st[id] || {}, v = vstat(d), x = heatFor(id), H = S.cfg.heating || {};
    const t = typeof s.target === 'number' ? s.target : 20, set = (n) => cmdAttr(id, { on: true, target: Math.min(30, Math.max(5, Math.round(n * 2) / 2)) });
    let hint = 'La modifica resta finché non cambi scenario.';
    if ((H.group || []).includes(id) && S.heat?.mode === 'inverno' && S.heat?.policy === 'app' && S.heat?.next) hint = `Gli orari la cambieranno ${whenLabel(S.heat.next)}.`;
    if (s.meMode === 4) hint = 'La valvola segue i programmi Meross: impostare una temperatura qui la mette in manuale.';
    return sheetHead(label(d), `<span class="st ${v.k}">${h(v.t)}</span>`)
      + dial({ id, type: 'valve', value: typeof s.target === 'number' ? s.target : null, current: s.current, min: 5, max: 30, step: 0.5, kind: s.on === false ? 'off' : s.meMode === 4 ? 'prog' : 'heat', top: s.on === false ? 'spenta' : 'impostata', label: s.current != null ? `in stanza ${fmt(s.current)}°` : '' })
      + `<div class="fine"><button aria-label="Meno" ${set(t - 0.5)}>${I('minus')}</button><span>trascina il cerchio</span><button aria-label="Più" ${set(t + 0.5)}>${I('plus')}</button></div>`
      + `<div class="btns"><button class="btn ${s.on ? 'on' : ''}" ${cmdAttr(id, { on: !s.on })}>${I('power')}${s.on ? 'Accesa' : 'Spenta'}</button><button class="btn" ${cmdAttr(id, { on: true, target: 'max' })}>${I('flame')}Al massimo</button></div>`
      + `<div class="btns" style="margin-top:10px">${x?.boost && boostOn() ? `<button class="btn" data-boost-cancel>${I('zap')}Annulla «Scalda ora» (fino alle ${clockOf(S.heat.boost.until)})</button>` : `<button class="btn" data-boost='${JSON.stringify([id])}'>${I('zap')}Scalda a ${S.cfg.heating?.temp ?? 21}° per 1 ora</button>`}</div>`
      + (x?.ok === false ? `<div class="hint" style="background:var(--bad-soft);color:var(--text)">${I('alert')}<span>Ultimo comando non arrivato: ${h(x.error || '')}</span></div>` : '')
      + `<div class="hint">${I('info')}<span>${h(hint)}${s.batteryMv ? ` Pile ${(s.batteryMv / 1000).toLocaleString('it-IT', { maximumFractionDigits: 2 })} V.` : ''}</span></div>`;
  },
  ac(id) {
    const d = byId(id), s = S.st[id] || {}, c = s.caps?.temp || { min: 16, max: 30, step: 1 }, t = s.target ?? 24, step = c.step || 1;
    const kind = !s.on ? 'off' : ['cool', 'cold'].includes(s.mode) ? 'cool' : ['heat', 'hot'].includes(s.mode) ? 'heat' : '';
    const set = (n) => cmdAttr(id, { target: Math.min(c.max ?? 30, Math.max(c.min ?? 16, n)) });
    return sheetHead('Climatizzatore', h(d?.room || ''))
      + dial({ id, type: 'ac', value: typeof s.target === 'number' ? s.target : null, current: s.current, min: c.min ?? 16, max: c.max ?? 30, step, kind, top: s.on ? (AC_MODE[s.mode] || ['', 'acceso'])[1] : 'spento', label: s.current != null ? `in stanza ${fmt(s.current)}°` : '' })
      + `<div class="fine"><button aria-label="Meno" ${set(t - step)}>${I('minus')}</button><span>trascina il cerchio</span><button aria-label="Più" ${set(t + step)}>${I('plus')}</button></div>`
      + `<div class="ac ${s.on ? '' : 'off'}">${acControls(d, true, true)}</div>`;
  },
  room(r) {
    const x = roomInfo(r), list = x.list, st = (d) => S.st[d.id] || {};
    const valves = list.filter((d) => d.type === 'thermostat'), acs = list.filter((d) => d.type === 'ac'), lights = list.filter((d) => d.type === 'light'), shs = list.filter((d) => d.type === 'shutter');
    const vr = (d) => { const s = st(d), v = vstat(d), t = typeof s.target === 'number' ? s.target : 20, set = (n) => cmdAttr(d.id, { on: true, target: Math.min(30, Math.max(5, n)) });
      return `<div class="vr"><button class="grow" data-sheet="valve" data-id="${h(d.id)}"><b>${h(label(d))}</b><span class="st ${v.k}">${h(v.t)}</span></button><span class="cur num">${fmt(s.current)}°</span>
        <span class="mini"><button aria-label="Meno" ${set(t - 0.5)}>${I('minus')}</button><span class="num">${s.target > 30 ? 'Max' : s.target != null ? fmt(s.target) + '°' : '--'}</span><button aria-label="Più" ${set(t + 0.5)}>${I('plus')}</button></span></div>`; };
    const acr = (d) => { const s = st(d), c = s.caps?.temp || { min: 16, max: 30, step: 1 }, t = s.target ?? 24, step = c.step || 1, set = (n) => cmdAttr(d.id, { target: Math.min(c.max ?? 30, Math.max(c.min ?? 16, n)) });
      return `<div class="vr"><button class="pwr ${s.on ? 'on' : ''}" style="width:44px;height:44px" aria-label="Accendi o spegni" ${cmdAttr(d.id, { on: !s.on })}>${I('power')}</button><button class="grow" data-sheet="ac" data-id="${h(d.id)}"><b>${h(label(d))}</b><span class="st ${s.on ? 'ok' : ''}">${s.on ? (AC_MODE[s.mode] || ['', 'Acceso'])[1] : 'Spento'}</span></button>
        <span class="mini"><button aria-label="Meno" ${set(t - step)}>${I('minus')}</button><span class="num">${fmt(s.target)}°</span><button aria-label="Più" ${set(t + step)}>${I('plus')}</button></span></div>`; };
    const lt = (d) => { const s = st(d); return `<button class="lt ${s.on ? 'on' : ''}" style="margin-bottom:8px" ${cmdAttr(d.id, { on: !s.on })}><span class="ic">${I('bulb')}</span>${h(label(d))}<span class="r">${s.online === false ? 'non raggiungibile' : s.on ? 'Accesa' : 'Spenta'}</span></button>`; };
    const sh = (d) => { const s = st(d); return `<div class="sh" style="margin-bottom:8px"><span class="ic">${I('blinds')}</span><b>${h(label(d))}</b><span class="ctl"><button class="${s.action === 'up' ? 'on' : ''}" aria-label="Alza" ${cmdAttr(d.id, { action: 'up' })}>${I('up')}</button><button aria-label="Ferma" ${cmdAttr(d.id, { action: 'stop' })}>${I('stop')}</button><button class="${s.action === 'down' ? 'on' : ''}" aria-label="Abbassa" ${cmdAttr(d.id, { action: 'down' })}>${I('down')}</button></span></div>`; };
    const block = (t, arr, fn) => (arr.length ? `<div class="rsec"><h4>${t}</h4>${arr.map(fn).join('')}</div>` : '');
    return sheetHead(r, `${x.temp != null ? fmt(x.temp) + '° · ' : ''}${h(x.sub)}`)
      + block('Termosifoni', valves, vr) + block('Climatizzatore', acs, acr) + block('Luci', lights, lt) + block('Tapparelle', shs, sh);
  },
  settings() {
    const th = ls.get('theme') || 'auto';
    return sheetHead('Impostazioni') + `<div class="list">
      <button class="row" data-sheet="sched">${I('clock')}<span class="grow"><b>Orari automatici</b><small>Avvia «Buongiorno» o «Buonanotte» a un orario</small></span>${I('right')}</button>
      <button class="row" data-sheet="siri">${I('mic')}<span class="grow"><b>Siri e automazioni</b><small>«Ehi Siri, esco di casa» e scenari automatici quando esci o rientri</small></span>${I('right')}</button>
      <button class="row" data-act="geo">${I('pin')}<span class="grow"><b>Meteo</b><small>${S.weather ? 'Attivo · tocca per aggiornare la posizione' : 'Usa la posizione di questo dispositivo'}</small></span>${I('right')}</button>
      <button class="row" data-sheet="diag">${I('wrench')}<span class="grow"><b>Diagnostica</b><small>Valvole, Sonoff, condizionatori e SwitchBot trovati</small></span>${I('right')}</button>
      <div class="row">${I('palette')}<span class="grow"><b>Aspetto</b></span><span class="seg" style="flex:none">${[['auto', 'Auto'], ['light', 'Chiaro'], ['dark', 'Scuro']].map(([k, n]) => `<button class="${th === k ? 'on' : ''}" data-theme-set="${k}">${n}</button>`).join('')}</span></div>
      ${DEMO ? '' : `<button class="row" data-act="logout">${I('key')}<span class="grow"><b>Cambia PIN</b><small>Il PIN verrà richiesto di nuovo</small></span></button>`}
    </div>`;
  },
  diag() { return sheetHead('Diagnostica', 'Cosa vedono i servizi collegati') + '<div id="diagBody"><p class="empty">Interrogo i dispositivi…</p></div><div class="btns"><button class="btn" data-act="diag-reload">Ricontrolla</button></div>'; },
  sched() {
    return sheetHead('Orari automatici', 'Avvia uno scenario a un orario') + `<div class="list" id="schList"><p class="empty">Carico…</p></div>
      <h4 class="sh4">Nuovo orario</h4><div class="form">
      <select id="schScene">${(S.cfg.scenes || []).map((s) => `<option value="${s.id}">${h(s.name)}</option>`).join('')}</select>
      <input id="schTime" type="time" value="07:30">
      <div class="days">${['L', 'M', 'M', 'G', 'V', 'S', 'D'].map((x, i) => `<button class="on" data-day="${i + 1}">${x}</button>`).join('')}</div>
      <button class="btn primary" data-act="sch-add">Aggiungi orario</button></div>`;
  },
  siri() { return sheetHead('Siri e automazioni', 'Comanda la casa con la voce o in automatico') + '<div id="siriBody"><p class="empty">Carico…</p></div>'; },
  pin() {
    return sheetHead('Inserisci il PIN', 'Serve una volta sola su questo dispositivo') + `<form class="form" id="pinForm"><input id="pinIn" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" style="font-size:22px;text-align:center;letter-spacing:.3em"><button class="btn primary">Entra</button></form>`;
  },
};
function openSheet(kind, id) {
  S.sheet = { kind, id }; renderSheet();
  $('#scrim').classList.add('open'); $('#sheet').classList.add('open');
  if (kind === 'diag') loadDiag();
  if (kind === 'sched') loadSched();
  if (kind === 'siri') loadSiri();
  if (kind === 'pin') setTimeout(() => $('#pinIn')?.focus(), 250);
}
function closeSheet() {
  S.sheet = null; $('#scrim').classList.remove('open'); $('#sheet').classList.remove('open');
  if (pinResolve) { pinResolve(null); pinResolve = null; }
}
function renderSheet() { if (S.sheet) $('#sheet').innerHTML = '<div class="grab"></div>' + SHEETS[S.sheet.kind](S.sheet.id); }
function askPin() { return new Promise((res) => { pinResolve = res; openSheet('pin'); }); }

async function loadDiag() {
  const el = () => $('#diagBody'); if (!el()) return;
  el().innerHTML = '<p class="empty">Interrogo i dispositivi…</p>';
  const [v, d] = await Promise.allSettled([api('valves'), api('discover')]);
  if (!el()) return;
  const row = (name, sub, tag, ok) => `<div class="row"><span class="grow"><b>${h(name)}</b>${sub ? `<small>${sub}</small>` : ''}</span><span class="tag ${ok ? 'ok' : 'bad'}">${h(tag)}</span></div>`;
  let html = '<h4 class="sh4">Valvole Meross</h4>';
  if (v.status === 'rejected') html += `<p class="empty">Errore: ${h(v.reason.message)}</p>`;
  else {
    const { valves, missing } = v.value;
    if (missing?.length) html += `<div class="hint" style="background:var(--bad-soft);color:var(--text)">${I('alert')}<span>Non trovate sull’hub: ${h(missing.join(', '))}</span></div>`;
    html += '<div class="list">' + valves.map((x) => row(x.name, [x.online ? `${fmt(x.current)}° → ${fmt(x.target)}°` : 'non risponde', x.mode != null && x.online ? ({ 0: 'manuale', 4: 'programma Meross' }[x.mode] || 'modo ' + x.mode) : '', x.batteryMv ? `pile ${(x.batteryMv / 1000).toFixed(2)} V` : '', x.duplicate ? '<b style="color:var(--bad)">nome doppio</b>' : '', x.configured ? '' : 'non in configurazione'].filter(Boolean).join(' · '), x.online ? 'online' : 'offline', x.online)).join('') + '</div>';
  }
  if (d.status === 'fulfilled') {
    for (const [k, title] of [['ewelink', 'Sonoff (eWeLink)'], ['tuya', 'Climatizzatori (Tuya)'], ['switchbot', 'SwitchBot']]) {
      const x = d.value[k] || { devices: [] };
      html += `<h4 class="sh4">${title}</h4>` + (x.error ? `<p class="empty" style="color:var(--bad)">${h(x.error)}</p>` : x.devices.length ? '<div class="list">' + x.devices.map((y) => row(y.name, `<span style="user-select:text">${h(y.id)}</span>`, y.online ? 'online' : 'offline', y.online)).join('') + '</div>' : '<p class="empty">Nessun dispositivo.</p>');
    }
  } else html += `<p class="empty">Errore: ${h(d.reason.message)}</p>`;
  el().innerHTML = html;
}
async function loadSiri(rotate = false) {
  let r; try { r = await api('hook-info', { method: 'POST', body: JSON.stringify({ rotate }) }); } catch (e) { const el = $('#siriBody'); if (el) el.innerHTML = `<p class="empty">Errore: ${h(e.message)}</p>`; return; }
  const el = $('#siriBody'); if (!el) return;
  const url = (a) => `${r.base}?t=${encodeURIComponent(r.token)}&do=${a}`;
  el.innerHTML = `<div class="hint" style="margin-top:0">${I('info')}<span>Ogni azione ha un link. Lo incolli nell’app <b>Comandi</b> dell’iPhone o dell’iPad. Porta e portone non sono mai inclusi.</span></div>
    <h4 class="sh4">Per la voce</h4><ol class="steps"><li>Apri <b>Comandi</b> → <b>+</b> → aggiungi l’azione <b>Ottieni contenuto dell’URL</b> e incolla il link.</li><li>Aggiungi <b>Pronuncia testo</b>: Siri ti dirà com’è andata.</li><li>Dai al comando il nome da pronunciare, es. «Esco di casa», e di’ <b>«Ehi Siri, esco di casa»</b>.</li></ol>
    <h4 class="sh4">In automatico</h4><ol class="steps"><li><b>Comandi</b> → <b>Automazione</b> → <b>+</b> → <b>Quando esco</b> (scegli casa) → <b>Esegui subito</b>.</li><li>Azione <b>Ottieni contenuto dell’URL</b> con il link di «Esco di casa».</li><li>Ripeti con <b>Quando arrivo</b> e il link di «Casa inverno».</li></ol>
    <h4 class="sh4">Azioni</h4><div class="list">${r.actions.map((a) => `<div class="row"><span class="grow"><b>${h(a.name)}</b><small class="urlbox">${h(url(a.id))}</small></span><button class="btn sm" data-copy="${h(url(a.id))}">${I('copy')}Copia</button></div>`).join('')}</div>
    <div class="hint">${I('alert')}<span>Chi ha questi link può comandare luci, tapparelle e riscaldamento. Non condividerli. Se pensi che siano finiti in mani sbagliate, genera link nuovi: quelli vecchi smettono di funzionare.</span></div>
    <div class="btns"><button class="btn" data-act="siri-rotate">Genera link nuovi</button></div>`;
}
let schedules = [];
async function loadSched() {
  try { schedules = (await api('schedules')) || []; } catch (e) { toast('Errore: ' + e.message); return; }
  const el = $('#schList'); if (!el) return;
  const D = ['L', 'M', 'M', 'G', 'V', 'S', 'D'];
  el.innerHTML = schedules.length ? schedules.map((s, i) => {
    const sc = S.cfg.scenes.find((x) => x.id === s.scene);
    return `<div class="row"><span class="grow"><b class="num">${h(s.time)} · ${h(sc?.name || s.scene)}</b><small>${s.days.length === 7 ? 'Ogni giorno' : s.days.map((d) => D[d - 1]).join(' ')}</small></span><button class="tag bad" data-sch-del="${i}">Elimina</button></div>`;
  }).join('') : '<p class="empty">Nessun orario impostato.</p>';
}
const saveSched = async () => { try { await api('schedules', { method: 'PUT', body: JSON.stringify({ schedules }) }); loadSched(); } catch (e) { toast('Errore: ' + e.message); } };

// ---------------------------------------------------------------- render
const TABS = [['home', 'home', 'Casa'], ['clima', 'thermo', 'Clima'], ['luci', 'bulb', 'Luci'], ['ingresso', 'lock', 'Ingresso']];
function render() {
  if (!S.cfg) return;
  $('#rail').innerHTML = `<span class="brand">${I('home')}</span>` + TABS.map(([k, ic, n]) => `<button class="tab ${S.view === k ? 'on' : ''}" data-go="${k}">${I(ic)}${n}</button>`).join('')
    + `<span class="spacer"></span><button class="tab" data-sheet="settings">${I('gear')}Altro</button>`;
  $('#view').innerHTML = (VIEWS[S.view] || VIEWS.home)();
  if (S.sheet && LIVE.has(S.sheet.kind)) renderSheet();
}

// ---------------------------------------------------------------- azioni
async function send(id, cmd) {
  const prev = S.st[id];
  S.st[id] = { ...prev, ...cmd, ...(cmd.target === 'max' ? { target: prev?.target } : {}) };
  render();
  try { await api('command', { method: 'POST', body: JSON.stringify({ device: id, command: cmd }) }); }
  catch (e) { S.st[id] = prev; render(); toast('Errore: ' + e.message); }
  setTimeout(refresh, 1500);
}
async function setMode(id, name) {
  const prev = S.heat?.mode; S.heat = { ...(S.heat || {}), mode: id }; render(); toast(`${name}…`);
  try {
    const r = await api('mode', { method: 'POST', body: JSON.stringify({ mode: id }) });
    const bad = (r || []).filter((x) => x.ok === false), wait = (r || []).filter((x) => x.ok === null).length;
    toast(bad.length ? `${name}: ${bad.length} ${bad.length === 1 ? 'valvola non raggiunta' : 'valvole non raggiunte'}` : wait ? `${name} attivo · ${wait} valvole entro un minuto` : `${name} attivo`);
  } catch (e) { S.heat.mode = prev; toast('Errore: ' + e.message); }
  refresh();
}
async function setPolicy(p) {
  S.heat = { ...(S.heat || {}), policy: p }; render();
  try { const r = await api('policy', { method: 'POST', body: JSON.stringify({ policy: p }) }); const bad = (r || []).filter((x) => x.ok === false); toast(bad.length ? `${bad.length} valvole non raggiunte` : p === 'meross' ? 'Le valvole seguono i programmi Meross' : 'Orari gestiti dall’app'); }
  catch (e) { toast('Errore: ' + e.message); }
  refresh();
}
async function runScene(id, name) {
  toast(`${name}…`);
  try { const r = await api('scene', { method: 'POST', body: JSON.stringify({ scene: id }) }); const bad = (r || []).filter((x) => !x.ok).length; toast(bad ? `${name}: ${bad} azioni non riuscite` : `${name} fatto`); }
  catch (e) { toast('Errore: ' + e.message); }
  refresh();
}
async function setBoost(ids) {
  toast('Scaldo…');
  try { const r = await api('boost', { method: 'POST', body: JSON.stringify({ ids, minutes: 60 }) }); const bad = (r || []).filter((x) => x.ok === false).length; toast(bad ? `${bad} valvole non raggiunte` : `Scaldo a ${S.cfg.heating?.temp ?? 21}° per un’ora`); }
  catch (e) { toast('Errore: ' + e.message); }
  refresh();
}
async function cancelBoost() {
  try { await api('boost', { method: 'POST', body: JSON.stringify({ cancel: true }) }); toast('Tornano gli orari normali'); } catch (e) { toast('Errore: ' + e.message); }
  refresh();
}
async function bulk(kind) {
  const list = kind === 'lights-off' ? devs('light').filter((d) => S.st[d.id]?.on !== false).map((d) => [d.id, { on: false }]) : devs('shutter').map((d) => [d.id, { action: kind === 'sh-up' ? 'up' : 'down' }]);
  if (!list.length) return toast(kind === 'lights-off' ? 'Le luci sono già spente' : 'Nessuna tapparella');
  return sendMany(list);
}
async function sendMany(list) {
  list.forEach(([id, c]) => { S.st[id] = { ...S.st[id], ...c }; }); render();
  const r = await Promise.allSettled(list.map(([id, c]) => api('command', { method: 'POST', body: JSON.stringify({ device: id, command: c }) })));
  const bad = r.filter((x) => x.status === 'rejected');
  toast(bad.length ? `${bad.length} non riusciti: ${bad[0].reason.message}` : 'Fatto');
  refresh();
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button,[data-close]');
  if (!b) return;
  const ds = b.dataset;
  if ('close' in ds) return closeSheet();
  if (ds.go) { if (S.sheet) closeSheet(); S.view = ds.go; ls.set('view', ds.go); render(); window.scrollTo({ top: 0 }); return; }
  if (ds.sheet) return openSheet(ds.sheet, ds.id);
  if (ds.mode) return setMode(ds.mode, ds.name);
  if (ds.policy) return setPolicy(ds.policy);
  if (ds.scene) return runScene(ds.scene, ds.name);
  if (ds.bulk) return bulk(ds.bulk);
  if (ds.acts) return sendMany(JSON.parse(ds.acts));
  if (ds.scroll) return $('#' + ds.scroll)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (ds.boost) return setBoost(ds.boost === 'zona' ? 'zona' : JSON.parse(ds.boost));
  if ('boostCancel' in ds) return cancelBoost();
  if (ds.dismiss) { const m = dismissed(); m[ds.dismiss] = Date.now() + 3 * 3600e3; ls.set('dismiss', JSON.stringify(m)); return render(); }
  if (ds.copy) { (navigator.clipboard?.writeText(ds.copy) || Promise.reject()).then(() => toast('Link copiato'), () => toast('Tieni premuto sul link per copiarlo')); return; }
  if (ds.act === 'geo') return askLocation();
  if (ds.act === 'wx' && S.weather) { const W = S.weather; return toast(`${WX(W.code)[1]} · oggi max ${fmt(W.maxToday, 0)}° · stanotte min ${fmt(W.minTonight, 0)}° · tramonto ${W.sunsetLabel}`); }
  if (ds.act === 'siri-rotate') { if (confirm('I link attuali smetteranno di funzionare. Continuare?')) loadSiri(true); return; }
  if (ds.cmd) return send(ds.id, JSON.parse(ds.cmd));
  if (ds.themeSet) { ls.set('theme', ds.themeSet === 'auto' ? null : ds.themeSet); if (ds.themeSet === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = ds.themeSet; return renderSheet(); }
  if (ds.day) return b.classList.toggle('on');
  if (ds.schDel != null) { schedules.splice(+ds.schDel, 1); return saveSched(); }
  if (ds.act === 'sch-add') {
    const days = [...document.querySelectorAll('.days .on')].map((x) => +x.dataset.day);
    if (!days.length) return toast('Scegli almeno un giorno');
    schedules.push({ id: Date.now().toString(36), scene: $('#schScene').value, time: $('#schTime').value, days, enabled: true });
    return saveSched();
  }
  if (ds.act === 'diag-reload') return loadDiag();
  if (ds.act === 'logout') { ls.set('pin', null); closeSheet(); toast('PIN rimosso'); return refresh(); }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'pinForm') return;
  e.preventDefault();
  const v = $('#pinIn').value.trim(), r = pinResolve; pinResolve = null;
  closeSheet(); r?.(v || null);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheet) closeSheet(); });

// Apertura con pressione lunga (porta e portone)
let holdT = null;
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('[data-hold]'); if (!b) return;
  holding = true; b.classList.add('holding');
  holdT = setTimeout(async () => {
    holdT = null; holding = false; b.classList.remove('holding');
    try { await api('command', { method: 'POST', body: JSON.stringify({ device: b.dataset.id, command: JSON.parse(b.dataset.hold) }) }); toast('Aperto'); navigator.vibrate?.(60); }
    catch (err) { toast('Errore: ' + err.message); }
    refresh();
  }, 1200);
});
['pointerup', 'pointercancel'].forEach((t) => document.addEventListener(t, () => {
  if (holdT) { clearTimeout(holdT); holdT = null; }
  holding = false; document.querySelectorAll('.holding').forEach((x) => x.classList.remove('holding'));
}, true));

// ---------------------------------------------------------------- avvio
async function refresh() {
  const [hs, st] = await Promise.allSettled([api('heating'), api('state')]);
  if (hs.status === 'fulfilled') S.heat = hs.value;
  if (st.status === 'fulfilled') S.st = st.value; else if (!DEMO) toast('Non riesco a leggere i dispositivi');
  if (!holding) render();
}
async function init() {
  try { S.cfg = await api('config'); }
  catch (e) {
    if (e.message === 'PIN richiesto') return init();
    DEMO = true; S.cfg = await demoApi('config', {}); toast('Server non raggiungibile: modalità demo');
  }
  if (!VIEWS[S.view]) S.view = 'home';
  render(); await loadWeather(); await refresh();
  setInterval(refresh, 20000);
  setInterval(async () => { await loadWeather(); if (!holding) render(); }, 30 * 60e3);
  setInterval(() => { const c = $('#clock'); if (c) c.textContent = nowText(); }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
}
init();
</script>
</body>
</html>
