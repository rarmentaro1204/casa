<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispositivi Meross</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  input, button { font-size: 1rem; padding: .6rem .8rem; }
  pre { background: #f3f3f3; padding: 1rem; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>Dispositivi Meross</h1>
<p>Scrivi il PIN dell'app e premi il pulsante: vedrai hub e termovalvole del tuo account.</p>
<input id="pin" type="password" placeholder="PIN" autocomplete="off">
<button id="go">Mostra dispositivi</button>
<button id="dbg">Diagnosi valvole</button>
<pre id="out"></pre>
<script>
document.getElementById('dbg').onclick = () => run('/api/meross-debug');
document.getElementById('go').onclick = () => run('/api/meross-devices');
async function run(url) {
  const out = document.getElementById('out');
  out.textContent = 'Carico...';
  try {
    const r = await fetch(url, { headers: { 'x-pin': document.getElementById('pin').value } });
    out.textContent = r.status + '\n' + JSON.stringify(await r.json(), null, 2);
  } catch (e) { out.textContent = 'Errore: ' + e.message; }
}
</script>
</body>
</html>
